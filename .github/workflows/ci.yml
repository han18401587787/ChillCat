name: ChillCat CI

on:
  push:
    branches: [main, develop, v3.0-dev]
  pull_request:
    branches: [main, v3.0-dev]
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)

jobs:
  # =============================================
  # iOS 构建验证
  # =============================================
  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          xcodebuild build \
            -scheme ChillCat \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  # =============================================
  # iOS UI 测试（连接已部署的云服务器）
  # =============================================
  ios-test:
    name: iOS Tests
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Create Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          ios=[r for r in data['runtimes'] if 'iOS' in r.get('name','') and r.get('isAvailable',False)]
          print(ios[-1]['identifier']) if ios else sys.exit(1)
          ")
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          iphones=[d for d in data['devicetypes'] if 'iPhone' in d.get('name','')]
          target=next((d for d in iphones if 'iPhone 16' in d['name']), iphones[-1])
          print(target['name'])
          ")
          xcrun simctl create CI-iPhone "$DEVICE" "$RUNTIME"
          xcrun simctl boot CI-iPhone
      - name: Run Tests
        run: |
          xcodebuild test \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=CI-iPhone' \
            -only-testing:ChillCatUITests/ChillCatV3UITests \
            -only-testing:ChillCatUITests/CCInteractionTests \
            -only-testing:ChillCatUITests/ChillCatVisualRegressionTests \
            -resultBundlePath ui-test-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        continue-on-error: true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ui-test-results.xcresult

  # =============================================
  # 测试报告汇总
  # =============================================
  report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [ios-test]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 绪安 v3.0 CI 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Build | ${{ needs.ios-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Tests | ${{ needs.ios-test.result }} |" >> $GITHUB_STEP_SUMMARY
