name: ChillCat CI

on:
  push:
    branches: [main, develop, v3.0-dev]
  pull_request:
    branches: [main, v3.0-dev]
  schedule:
    # 每天 UTC 2:00 (北京时间 10:00) 自动运行
    - cron: '0 2 * * *'

jobs:
  # =============================================
  # Go 后端测试 (沙箱可运行)
  # =============================================
  server-test:
    name: Server Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1 -race -json > test-results.json
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/test-results.json
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server
          version: latest
          args: --timeout=5m

  # =============================================
  # iOS 构建验证 (macOS runner)
  # =============================================
  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          xcodebuild build \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  # =============================================
  # iOS UI 测试 (macOS runner)
  # =============================================
  ios-uitest:
    name: iOS UI Tests
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ChillCatUITests/ChillCatV3UITests \
            -resultBundlePath ui-test-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-uitest-results
          path: ui-test-results.xcresult

  # =============================================
  # iOS 快照视觉回归测试
  # =============================================
  ios-snapshot:
    name: iOS Snapshot Tests
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run Snapshot Tests
        run: |
          xcodebuild test \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ChillCatTests/CCSnapshotPageTests \
            -resultBundlePath snapshot-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Upload snapshot results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-snapshot-results
          path: snapshot-results.xcresult

  # =============================================
  # Docker 构建
  # =============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: server-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: server
        run: docker build -t chillcat-server .

  # =============================================
  # 测试报告汇总
  # =============================================
  report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [server-test, ios-uitest, ios-snapshot]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 绪安 v3.0 CI 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server Test | ${{ needs.server-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS UI Test | ${{ needs.ios-uitest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Snapshot | ${{ needs.ios-snapshot.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
