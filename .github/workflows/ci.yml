name: ChillCat CI

on:
  push:
    branches: [main, develop, v3.0-dev]
  pull_request:
    branches: [main, v3.0-dev]
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)

jobs:
  # =============================================
  # iOS 构建验证
  # =============================================
  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install CocoaPods dependencies
        run: pod install --repo-update
      - name: Build
        run: |
          xcodebuild build \
            -workspace ChillCat.xcworkspace \
            -scheme ChillCat \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  # =============================================
  # iOS UI 测试（连接已部署的云服务器）
  # 三个测试套件共 66 个测试方法,串行 > 30min(CI #273 超时根因)
  # → matrix 并行:每个套件独立 job,反馈时间 ≈ 最慢套件而非总和
  # =============================================
  ios-test:
    name: iOS Tests (${{ matrix.suite }})
    runs-on: macos-15
    needs: ios-build
    timeout-minutes: 30  # 单个套件上限;含 ~5min 构建 + 套件测试时间
    strategy:
      fail-fast: false  # 一个套件失败/超时不取消其他套件,保证结果完整
      matrix:
        suite: [ChillCatV3UITests, CCInteractionTests, ChillCatVisualRegressionTests]
    env:
      CHILLCAT_API_URL: "http://81.70.178.249:8080"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install CocoaPods dependencies
        run: pod install --repo-update
      - name: Create Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          ios=[r for r in data['runtimes'] if 'iOS' in r.get('name','') and r.get('isAvailable',False)]
          print(ios[-1]['identifier']) if ios else sys.exit(1)
          ")
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          iphones=[d for d in data['devicetypes'] if 'iPhone' in d.get('name','')]
          target=next((d for d in iphones if 'iPhone 16' in d['name']), iphones[-1])
          print(target['name'])
          ")
          xcrun simctl create CI-iPhone "$DEVICE" "$RUNTIME"
          xcrun simctl boot CI-iPhone
      - name: Run Tests
        run: |
          xcodebuild test \
            -workspace ChillCat.xcworkspace \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=CI-iPhone' \
            -only-testing:ChillCatUITests/${{ matrix.suite }} \
            -resultBundlePath ui-test-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        # 不再 continue-on-error:测试失败必须标红(证据步骤有 if: always() 仍会产出)

      # ── 解析 xcresult 生成 JSON 报告 ──
      # Xcode 16+ 新版子命令:直接拿到每个失败测试的断言消息,
      # 并 echo 到 job 日志——失败时不用下载 artifact 就能定位原因
      - name: Parse Test Results
        if: always()
        run: |
          xcrun xcresulttool get test-results tests \
            --path ui-test-results.xcresult --format json > tests-raw.json 2>/dev/null || true
          python3 -c "
          import json

          def walk(node, path, out):
              # 不依赖具体 schema key(children/testNodes 不定),递归所有嵌套结构
              if isinstance(node, dict):
                  name = node.get('name', '')
                  result = node.get('result', '')
                  failures = node.get('failures') or []
                  if name and (result == 'Failed' or failures):
                      out.append({
                          'test': f'{path}/{name}'.strip('/'),
                          'result': result or 'Failed',
                          'duration': node.get('duration', ''),
                          'failures': failures,
                      })
                  for key, value in node.items():
                      if isinstance(value, (dict, list)) and key != 'failures':
                          walk(value, f'{path}/{name}'.strip('/') if name else path, out)
              elif isinstance(node, list):
                  for item in node:
                      walk(item, path, out)

          try:
              with open('tests-raw.json') as f:
                  data = json.load(f)
              out = []
              walk(data, '', out)
              summary = {'failed_count': len(out), 'failures': out}
          except Exception as e:
              summary = {'error': f'parse failed: {e}'}
          with open('test-summary-${{ matrix.suite }}.json', 'w') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          # 同步打印到日志,失败原因一目了然
          print(json.dumps(summary, ensure_ascii=False, indent=2)[:6000])
          "

      # ── 收集失败截图 ──
      - name: Collect Failure Screenshots
        if: always()
        run: |
          mkdir -p failure-screenshots
          # 从临时目录复制 VisualTesting 失败截图
          cp -r /tmp/VisualDiffFailures/* failure-screenshots/ 2>/dev/null || true
          # Xcode 16+:导出 xcresult 附件(XCUITest 失败自动截图 + XCTAttachment)
          xcrun xcresulttool export attachments \
            --path ui-test-results.xcresult \
            --output-path failure-screenshots 2>/dev/null || true
          ls -la failure-screenshots/ 2>/dev/null || echo "No failure screenshots"

      # ── 上传测试报告(按套件命名 artifact,避免 matrix 间互相覆盖) ──
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results-${{ matrix.suite }}
          path: |
            ui-test-results.xcresult
            test-summary-${{ matrix.suite }}.json
            failure-screenshots/

  # =============================================
  # 测试报告汇总 + 问题清单
  # =============================================
  report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    # needs 必须显式包含 ios-build,否则下方 needs.ios-build.result 取到空字符串
    needs: [ios-build, ios-test]
    if: always()
    steps:
      # matrix 各套件 artifact 按 pattern 匹配合并下载到同一目录
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ios-test-results-*
          merge-multiple: true
          path: test-artifacts

      - name: Generate Issue Report
        run: |
          echo "## 🧪 绪安 v3.0 CI 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Build | ${{ needs.ios-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Tests (3 套件并行) | ${{ needs.ios-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 测试套件(并行 matrix)" >> $GITHUB_STEP_SUMMARY
          echo "- **ChillCatV3UITests** — Tab导航/页面入口/功能验证" >> $GITHUB_STEP_SUMMARY
          echo "- **CCInteractionTests** — 控件类型/点击区域/输入框/按钮状态" >> $GITHUB_STEP_SUMMARY
          echo "- **ChillCatVisualRegressionTests** — AI视觉校验/像素对比" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 检查是否有失败截图
          if ls test-artifacts/failure-screenshots/*.png 2>/dev/null; then
            echo "### ⚠️ 视觉差异截图" >> $GITHUB_STEP_SUMMARY
            for f in test-artifacts/failure-screenshots/*.png; do
              echo "- $(basename $f)" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # 逐个套件输出测试摘要
          for f in test-artifacts/test-summary-*.json; do
            [ -f "$f" ] || continue
            suite=$(basename "$f" .json | sed 's/test-summary-//')
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### ${suite}" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          # 生成可操作的修复建议
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 修复流程" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 \`ios-test-results\` artifact 查看详细日志" >> $GITHUB_STEP_SUMMARY
          echo "2. 在 Xcode 中打开 \`.xcresult\` 文件查看具体失败用例" >> $GITHUB_STEP_SUMMARY
          echo "3. 对照 \`failure-screenshots/\` 中的截图定位视觉差异" >> $GITHUB_STEP_SUMMARY
          echo "4. 修复代码后推送，CI 自动重新验证" >> $GITHUB_STEP_SUMMARY
