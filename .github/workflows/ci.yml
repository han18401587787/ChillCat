name: ChillCat CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server-test:
    name: Server Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1 -race
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server
          version: latest
          args: --timeout=5m

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: server-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: server
        run: docker build -t chillcat-server .
