name: ChillCat CI

on:
  push:
    branches: [main, develop, v3.0-dev]
  pull_request:
    branches: [main, v3.0-dev]
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)

jobs:
  # =============================================
  # iOS 构建验证
  # =============================================
  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          xcodebuild build \
            -scheme ChillCat \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  # =============================================
  # iOS UI 测试
  # =============================================
  ios-uitest:
    name: iOS UI Tests
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Create Simulator
        run: |
          # 获取可用 runtime
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          ios=[r for r in data['runtimes'] if 'iOS' in r.get('name','') and r.get('isAvailable',False)]
          if ios: print(ios[-1]['identifier'])
          else: sys.exit(1)
          ")
          echo "使用 Runtime: $RUNTIME"
          # 找到 iPhone 16 或最近的 device type
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          iphones=[d for d in data['devicetypes'] if 'iPhone' in d.get('name','')]
          target=next((d for d in iphones if 'iPhone 16' in d['name']), iphones[-1])
          print(target['name'])
          ")
          echo "使用 Device: $DEVICE"
          xcrun simctl create "CI-iPhone" "$DEVICE" "$RUNTIME"
          xcrun simctl boot "CI-iPhone"
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=CI-iPhone' \
            -only-testing:ChillCatUITests/ChillCatV3UITests \
            -resultBundlePath ui-test-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-uitest-results
          path: ui-test-results.xcresult

  # =============================================
  # iOS 快照视觉回归测试
  # =============================================
  ios-snapshot:
    name: iOS Snapshot Tests
    runs-on: macos-15
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Create Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          ios=[r for r in data['runtimes'] if 'iOS' in r.get('name','') and r.get('isAvailable',False)]
          if ios: print(ios[-1]['identifier'])
          else: sys.exit(1)
          ")
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          iphones=[d for d in data['devicetypes'] if 'iPhone' in d.get('name','')]
          target=next((d for d in iphones if 'iPhone 16' in d['name']), iphones[-1])
          print(target['name'])
          ")
          xcrun simctl create "CI-iPhone-Snapshot" "$DEVICE" "$RUNTIME"
          xcrun simctl boot "CI-iPhone-Snapshot"
      - name: Run Snapshot Tests
        run: |
          xcodebuild test \
            -scheme ChillCat \
            -destination 'platform=iOS Simulator,name=CI-iPhone-Snapshot' \
            -only-testing:ChillCatTests/CCSnapshotPageTests \
            -resultBundlePath snapshot-results.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Upload snapshot results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-snapshot-results
          path: snapshot-results.xcresult

  # =============================================
  # 测试报告汇总
  # =============================================
  report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    needs: [ios-uitest, ios-snapshot]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 绪安 v3.0 CI 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Build | ${{ needs.ios-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS UI Test | ${{ needs.ios-uitest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Snapshot | ${{ needs.ios-snapshot.result }} |" >> $GITHUB_STEP_SUMMARY
